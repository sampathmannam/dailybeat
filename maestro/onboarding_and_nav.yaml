# Maestro E2E flows for DailyBeat
# Install: https://maestro.mobile.dev
# Run: maestro test maestro/

appId: com.dailybeat.app.qa.e2eloop
---
- launchApp:
    clearState: true
- tapOn: "Continue"
- tapOn: "Officer name"
- inputText: "Inspector Audit"
- tapOn: "Continue"
- tapOn: "Get started"
- assertVisible: "Today"
- scrollUntilVisible:
    element:
      text: "Load synthetic demo day"
    direction: DOWN
- tapOn: "Load synthetic demo day"
- tapOn: "Days"
- assertVisible: "Your days"
- tapOn: "Insights"
- assertVisible: "Actionable insight"
- tapOn: "Settings"
- assertVisible: "Capture"
