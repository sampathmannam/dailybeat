# PatrolGrid supervisor assignment E2E flow.

appId: com.dailybeat.app.patrolgrid.qa
---
- launchApp:
    clearState: true
- tapOn: "Continue"
- tapOn: "Officer name"
- inputText: "Inspector Audit"
- hideKeyboard
- tapOn: "Supervisor"
- tapOn: "Continue"
- tapOn: "Get started"
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Patrol Control"
- tapOn: "Assign patrol"
- assertVisible: "Route and duty window"
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- tapOn: "Unit 9"
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- tapOn: "Flexible area coverage"
- tapOn: "Assign mission"
- assertVisible: "Upcoming"
- assertVisible: "Day patrol · School corridor"
