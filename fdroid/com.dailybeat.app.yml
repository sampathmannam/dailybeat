AntiFeatures:
  NonFreeNet:
    en-US: Optional cloud drafting offers presets for proprietary AI services; it
      is off by default.
  TetheredNet:
    en-US: Optional verified Tamil Nadu map downloads are hosted on GitHub Releases.
  Tracking:
    en-US: Online maps are on by default and disclose the IP address and viewed areas
      to map providers. They can be disabled in Settings.
