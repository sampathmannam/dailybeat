MaintainerNotes: |-
  Upstream recipe template. Replace the commit tag with its full immutable commit
  hash in fdroiddata. Store builds exclude Google dependencies and all private
  build-time backup configuration. The removed files are unused GMS sources and
  test-only map fixtures; removing them does not change the store APK.
  MapLibre and other FLOSS dependencies come from Google Maven or Maven Central.
  The downloaded map is data only, with hashes pinned in the APK; there is no
  executable-code downloader or in-app updater. Network flags are deliberately
  disclosed for review; no advertising or analytics SDK is shipped.

