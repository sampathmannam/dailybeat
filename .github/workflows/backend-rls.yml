name: Backend RLS

# The cloud-backup table holds a police officer's whole location history. Its only protection is
# Postgres row-level security, and until now nothing executed those policies — the release-policy
# suite only reads the migration text. This job stands up the real Postgres + auth stack and runs
# the pgTAP suite, which signs in as two users and proves one cannot read, overwrite, delete or
# forge the other's backup, and that the snapshot size cap rejects an oversized upload.
#
# The CLI is installed with a version-pinned npx rather than a marketplace action, so the only
# `uses:` is the checkout this repo already allows, and no action-allowlist change is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-rls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_CLI_VERSION: "2.109.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test destructive-action authentication
        run: npx --yes deno@2.5.6 test supabase/functions/delete-account/handler_test.ts

      - name: Name the disposable recovery stack
        env:
          LOCAL_PROJECT_ID: dailybeat-hardening-${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('supabase/config.toml')
          p.write_text(p.read_text().replace('project_id = "dailybeat"', 'project_id = "' + os.environ['LOCAL_PROJECT_ID'] + '"', 1))
          PY

      - name: Start Postgres and Auth
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" start
          --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Apply migrations from an empty database
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --no-seed

      - name: Run row-level-security pgTAP suite
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" test db

      - name: Exercise archive Auth and HTTP protocol
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" status -o json | python3 scripts/archive_backend_smoke.py

      - name: Verify reviewed schema and migration source hashes
        env:
          LOCAL_DB_CONTAINER: supabase_db_dailybeat-hardening-${{ github.run_id }}
        run: |
          set -o pipefail
          docker exec -i "$LOCAL_DB_CONTAINER" psql -U postgres -d postgres -X -A -t -F '|' \
            < scripts/production_schema_fingerprint.sql | python3 scripts/verify_schema_fingerprints.py

      - name: Restore synthetic Auth and backups and verify isolation
        env:
          LOCAL_DB_CONTAINER: supabase_db_dailybeat-hardening-${{ github.run_id }}
        run: |
          umask 077
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status -o json > "$RUNNER_TEMP/dailybeat-local-status.json"
          python3 scripts/local_database_recovery_drill.py \
            --local-status "$RUNNER_TEMP/dailybeat-local-status.json" \
            --container "$LOCAL_DB_CONTAINER" --output "$RUNNER_TEMP/dailybeat-recovery"

      - name: Stop the stack
        if: always()
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup
