name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patrolgrid-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install hash-locked API, load, and policy test tools
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          ci_venv="$RUNNER_TEMP/patrolgrid-ci"
          python3 -m venv "$ci_venv"
          "$ci_venv/bin/python" -m pip install \
            --index-url https://pypi.org/simple \
            --no-cache-dir --no-deps --only-binary=:all: --require-hashes \
            -r scripts/requirements-ci.txt
          "$ci_venv/bin/python" -m pip check
          printf '%s\n' "$ci_venv/bin" >> "$GITHUB_PATH"

      - name: Start disposable Supabase stack
        run: supabase start --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor

      - name: Verify migrations and row-level security
        run: |
          supabase db reset --local --no-seed
          supabase test db --local
          supabase db lint --local --level warning --schema public

      - name: Exercise Auth and PostgREST end to end
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          python3 tools/patrolgrid/supabase_e2e.py

      - name: Run synthetic PatrolGrid load test
        run: |
          locust -f tools/locust/patrolgrid_locust.py \
            --headless --users 10 --spawn-rate 5 --run-time 15s --only-summary

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build and test
        run: |
          cd android
          ./gradlew assembleDebug testDebugUnitTest lintDebug --dependency-verification strict --no-daemon --stacktrace

      - name: Instrumentation tests (emulator)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          # MapLibre ships x86_64, so the cloud-only app can run on this emulator.
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell getprop sys.boot_completed | grep -q 1
            until adb shell pm list packages >/dev/null 2>&1; do sleep 2; done
            cd android && ./gradlew connectedDebugAndroidTest --dependency-verification strict --no-daemon --stacktrace

      - name: Python tests
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          ci_venv="$RUNNER_TEMP/patrolgrid-ci"
          python3 -m venv "$ci_venv"
          "$ci_venv/bin/python" -m pip install \
            --index-url https://pypi.org/simple \
            --no-cache-dir --no-deps --only-binary=:all: --require-hashes \
            -r scripts/requirements-ci.txt
          "$ci_venv/bin/python" -m pip check
          "$ci_venv/bin/python" -m pytest scripts/tests/ -q
