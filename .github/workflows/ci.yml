name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build and test
        run: |
          cd android
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Instrumentation tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          # MapLibre ships x86_64, so the cloud-only app can run on this emulator.
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell getprop sys.boot_completed | grep -q 1
            until adb shell pm list packages >/dev/null 2>&1; do sleep 2; done
            cd android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Python tests
        run: |
          pip install -e ".[dev]"
          python3 -m pytest scripts/tests/ -q
