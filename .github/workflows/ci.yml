name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify backend and release policies
        run: |
          pip install -e ".[dev]"
          python3 -m pytest scripts/tests/ -q

  # The hosted Android emulator currently has a known external-network regression. Exercise the
  # exact authenticated Supabase protocol from the runner and restore the dedicated QA backup in
  # a verified finally block, while the Android jobs independently cover all app/UI behavior.
  live-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DAILYBEAT_BACKUP_TEST_EMAIL: ${{ secrets.DAILYBEAT_BACKUP_TEST_EMAIL }}
      DAILYBEAT_BACKUP_TEST_PASSWORD: ${{ secrets.DAILYBEAT_BACKUP_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Live cloud backup upload, download, and cleanup
        run: python3 scripts/live_backup_e2e.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build, unit test, and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Upload QA APK and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dailybeat-qa-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  # Keep the established offline check name for branch-protection compatibility while the
  # separate live-backup job verifies the external service.
  offline-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DAILYBEAT_OFFLINE_TESTS_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build disposable offline test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PdailybeatDebugApplicationIdSuffix=.qa.e2eloop --no-daemon
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline core end-to-end tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          script: bash .github/scripts/run-instrumentation.sh
      - name: Upload offline test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-instrumentation-${{ github.run_id }}
          retention-days: 7
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/outputs/instrumentation-evidence/

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dailybeat-android-instrumentation
      cancel-in-progress: false
    env:
      DAILYBEAT_OFFLINE_TESTS_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compile before the emulator starts. Building MapLibre native APKs while the emulator is
      # booting can starve Android's package service on hosted runners and produce a false test
      # failure before a single test is installed.
      - name: Build instrumentation APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PdailybeatDebugApplicationIdSuffix=.qa.e2eloop --no-daemon --stacktrace

      - name: Instrumentation tests (Android 14 emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          script: bash .github/scripts/run-instrumentation.sh

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumentation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/outputs/instrumentation-evidence/
