name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          cd android
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Instrumentation tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # MediaPipe Tasks GenAI currently packages libllm_inference_engine_jni.so
          # for arm64-v8a only. Match the hosted emulator to the APK ABI.
          arch: arm64-v8a
          profile: Nexus 6
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Python tests
        run: |
          pip install -e ".[dev]"
          python3 -m pytest scripts/tests/ -q
