name: Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/requests/*.txt'
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and wait for protected checks
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            test "$GITHUB_REF" = refs/heads/main
            release_version="$(tr -d '[:space:]' < release/version.txt)"
          fi

          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "versionName = \"$release_version\"" android/app/build.gradle.kts

          release_tag="v$release_version"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          # The dependency-review check runs on, and is required for, the protected pull request.
          # These checks run again on the resulting main commit.
          required_checks=(build instrumentation live-backup release-policy codeql)
          deadline=$((SECONDS + 1800))

          while true; do
            checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs")"
            waiting=false

            for required_check in "${required_checks[@]}"; do
              state="$(jq -r --arg name "$required_check" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | last
                | if . == null then "missing"
                  elif .status != "completed" then .status
                  else (.conclusion // "missing")
                  end
              ' <<< "$checks_json")"

              case "$state" in
                success)
                  ;;
                missing|queued|in_progress|requested|waiting|pending)
                  waiting=true
                  ;;
                *)
                  echo "Required check '$required_check' completed as '$state'."
                  exit 1
                  ;;
              esac
            done

            if [[ "$waiting" == false ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for protected checks."
              exit 1
            fi

            echo "Waiting for protected checks to pass..."
            sleep 20
          done

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Restore permanent signing key
        env:
          DAILYBEAT_KEYSTORE_BASE64: ${{ secrets.DAILYBEAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$DAILYBEAT_KEYSTORE_BASE64"
          printf '%s' "$DAILYBEAT_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build stable APK and unit tests
        env:
          DAILYBEAT_STORE_PASSWORD: ${{ secrets.DAILYBEAT_STORE_PASSWORD }}
          DAILYBEAT_KEY_PASSWORD: ${{ secrets.DAILYBEAT_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$DAILYBEAT_STORE_PASSWORD"
          test -n "$DAILYBEAT_KEY_PASSWORD"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cd android
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Verify permanent signing certificate
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          $apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | tee certificate.txt
          grep -qi '44510de2f642f54f8f046fc05b44227a15a2e8473460594b106e976862d3436f' certificate.txt

      - name: Generate SHA-256 checksums
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          release_apk="DailyBeat-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$release_apk"
          sha256sum "$release_apk" > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          tag_sha=""
          if existing_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha' 2>/dev/null)"; then
            tag_sha="$existing_tag_sha"
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG already points to $tag_sha, not $GITHUB_SHA."
            exit 1
          fi

          release_apk="DailyBeat-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$release_apk" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "$release_apk" \
              SHA256SUMS.txt
          fi

      # The runner is ephemeral and no artifact upload includes it, but the permanent signing key
      # should not outlive the step that needs it.
      - name: Remove the decoded signing key
        if: always()
        run: rm -f android/release.keystore
