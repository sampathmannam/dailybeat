name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore permanent signing key
        env:
          DAILYBEAT_KEYSTORE_BASE64: ${{ secrets.DAILYBEAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$DAILYBEAT_KEYSTORE_BASE64"
          printf '%s' "$DAILYBEAT_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build stable APK and unit tests
        env:
          DAILYBEAT_STORE_PASSWORD: ${{ secrets.DAILYBEAT_STORE_PASSWORD }}
          DAILYBEAT_KEY_PASSWORD: ${{ secrets.DAILYBEAT_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$DAILYBEAT_STORE_PASSWORD"
          test -n "$DAILYBEAT_KEY_PASSWORD"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cd android
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Verify permanent signing certificate
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          $apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | tee certificate.txt
          grep -qi '44510de2f642f54f8f046fc05b44227a15a2e8473460594b106e976862d3436f' certificate.txt

      - name: Generate SHA-256 checksums
        run: |
          sha256sum android/app/build/outputs/apk/release/app-release.apk > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            SHA256SUMS.txt
