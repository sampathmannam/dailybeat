name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and CI gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          release_version="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$release_version\"" android/app/build.gradle.kts
          for required_check in verify instrumentation; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq ".check_runs
                | map(select(.name == \"$required_check\" and .status == \"completed\"))
                | sort_by(.completed_at)
                | last
                | .conclusion // \"missing\"")"
            test "$conclusion" = success || {
              echo "Required CI check '$required_check' is '$conclusion', not success."
              exit 1
            }
          done

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Restore permanent signing key
        env:
          DAILYBEAT_KEYSTORE_BASE64: ${{ secrets.DAILYBEAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$DAILYBEAT_KEYSTORE_BASE64"
          printf '%s' "$DAILYBEAT_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build stable APK and unit tests
        env:
          DAILYBEAT_STORE_PASSWORD: ${{ secrets.DAILYBEAT_STORE_PASSWORD }}
          DAILYBEAT_KEY_PASSWORD: ${{ secrets.DAILYBEAT_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$DAILYBEAT_STORE_PASSWORD"
          test -n "$DAILYBEAT_KEY_PASSWORD"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cd android
          ./gradlew assembleRelease testReleaseUnitTest lintRelease --no-daemon --stacktrace

      - name: Verify permanent signing certificate
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          $apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | tee certificate.txt
          grep -qi '44510de2f642f54f8f046fc05b44227a15a2e8473460594b106e976862d3436f' certificate.txt

      - name: Generate SHA-256 checksums
        run: |
          release_apk="DailyBeat-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$release_apk"
          sha256sum "$release_apk" > SHA256SUMS.txt

      # Published with the built-in CLI rather than a third-party action: this repository
      # allows only specific actions, and gh needs no allowlist entry.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "DailyBeat-${{ github.ref_name }}.apk" \
            SHA256SUMS.txt
