version: 2

# Dependabot security updates were already enabled for this repository; this file adds scheduled
# version updates so the Gradle graph and the pinned action SHAs do not silently age between
# releases. Every update still has to pass build, instrumentation, live-backup, release-policy and
# codeql before it can reach main.
updates:
  - package-ecosystem: gradle
    directory: /android
    # Avoid the highest-risk window immediately after a compromised or unstable package release.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-coroutines:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
