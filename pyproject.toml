[project]
name = "dailybeat"
version = "0.1.0"
description = "Local-model-only police dairy writer for Android"
requires-python = ">=3.10"

# Runtime deps
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# Dev / training / eval toolchain
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipython>=8.0",
]
train = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "trl>=0.11",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "datasets>=2.20",
    "transformers>=4.44",
    "torch>=2.3",
]
eval = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]
